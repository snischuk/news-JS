<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <meta name="description" content="Browse the latest news from trusted sources around the world." />
        <title>NewsPortal</title>
    </head>
    <body>
        <div class="page-container">
            <header>
                <h1>News Portal</h1>
            </header>
            <main>
                <div class="sources buttons"></div>
                <div class="news"></div>
            </main>
            <footer>
                <div class="footer-content">
                    <div class="footer-brand">
                        <a href="https://rs.school/courses/javascript">
                            <img src="./assets/logo.svg" alt="RSSchool logo" width="30" height="30" />
                        </a>
                        <span class="copyright">&copy; Copyright 2026</span>
                    </div>
                    <span class="footer-author"><a href="https://github.com/snischuk">Created by Max Snischuk</a></span>
                </div>
            </footer>
        </div>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
